<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FFFFFF; }
  a { color: #6366F1; text-decoration: none; }
  a:hover { color: #4F51D8; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  input::placeholder { color: #9A9AA5; opacity: 1; }
</style>
</helmet>
<div style="min-height:100vh;background:#FFFFFF;font-family:'Geist',system-ui,sans-serif;padding:72px 64px;box-sizing:border-box;display:flex;justify-content:center">
  <div style="display:flex;flex-direction:column;gap:48px">
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Modal / Anatomy</div>
      <div style="width:440px;background:#FFFFFF;border:1px solid #E2E2E8;border-radius:14px;box-shadow:0 16px 48px rgba(24,24,44,0.16), 0 4px 12px rgba(24,24,44,0.06);box-sizing:border-box;overflow:hidden">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 0">
          <div style="display:flex;flex-direction:column;gap:3px">
            <span style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;color:#1B1B1F">Rename component</span>
            <span style="font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:400;color:#55555E">This will update every instance in the library.</span>
          </div>
          <button style="width:26px;height:26px;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#9A9AA5;flex-shrink:0" style-hover="background:hsl(215,15%,92%);color:#232329">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#232329">Name</label>
          <input value="Date Picker" readOnly="{{ true }}" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid hsl(210,14%,87%);background:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#232329;outline:none">
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;background:hsl(215,15%,97%);border-top:1px solid #ECECF0">
          <button style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:hsl(215,15%,12%);background:#FFFFFF;border:1px solid hsl(210,14%,87%);transition:120ms ease-in" style-hover="background:hsl(215,15%,97%)">Cancel</button>
          <button style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(9,11,11,0.6);background:hsl(210,100%,45%);border:1px solid hsl(210,100%,42%);box-shadow:inset 0 1px 0 rgba(51,153,255,0.5), inset 0 -1px 0 1px rgba(0,77,153,0.4), 0 2px 4px rgba(9,11,11,0.1);transition:120ms ease-in" style-hover="background:hsl(210,100%,38%);box-shadow:none">Save changes</button>
        </div>
      </div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Modal / Destructive confirm</div>
      <div style="width:400px;background:#FFFFFF;border:1px solid #E2E2E8;border-radius:14px;box-shadow:0 16px 48px rgba(24,24,44,0.16), 0 4px 12px rgba(24,24,44,0.06);box-sizing:border-box;overflow:hidden">
        <div style="padding:18px 20px;display:flex;gap:12px;align-items:flex-start">
          <span style="width:34px;height:34px;border-radius:10px;background:hsl(0,72%,95%);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="hsl(0,72%,45%)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h17M9.5 7V4.5h5V7M6 7l1 13.5h10L18 7M10 11v5.5M14 11v5.5"></path></svg>
          </span>
          <div style="display:flex;flex-direction:column;gap:3px">
            <span style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;color:#1B1B1F">Delete component?</span>
            <span style="font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:400;color:#55555E;line-height:1.5">"Tabs" will be removed from the library. This action cannot be undone.</span>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;background:hsl(215,15%,97%);border-top:1px solid #ECECF0">
          <button style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:hsl(215,15%,12%);background:#FFFFFF;border:1px solid hsl(210,14%,87%);transition:120ms ease-in" style-hover="background:hsl(215,15%,97%)">Cancel</button>
          <button style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(9,11,11,0.5);background:hsl(0,72%,48%);border:1px solid hsl(0,72%,42%);box-shadow:inset 0 1px 0 rgba(255,120,120,0.4), inset 0 -1px 0 1px rgba(120,0,0,0.3), 0 2px 4px rgba(9,11,11,0.1);transition:120ms ease-in" style-hover="background:hsl(0,72%,40%);box-shadow:none">Delete</button>
        </div>
      </div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Interactive</div>
      <button onClick="{{ openModal }}" style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(9,11,11,0.6);background:hsl(210,100%,45%);border:1px solid hsl(210,100%,42%);box-shadow:inset 0 1px 0 rgba(51,153,255,0.5), inset 0 -1px 0 1px rgba(0,77,153,0.4), 0 2px 4px rgba(9,11,11,0.1);transition:120ms ease-in" style-hover="background:hsl(210,100%,38%);box-shadow:none">Open modal</button>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeModal }}" style="position:fixed;inset:0;background:rgba(20,22,28,0.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:overlay-in 0.15s ease-out">
          <div onClick="{{ stop }}" style="width:440px;max-width:calc(100vw - 48px);background:#FFFFFF;border:1px solid #E2E2E8;border-radius:14px;box-shadow:0 16px 48px rgba(24,24,44,0.24), 0 4px 12px rgba(24,24,44,0.08);box-sizing:border-box;overflow:hidden;animation:modal-in 0.18s ease-out">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 0">
              <div style="display:flex;flex-direction:column;gap:3px">
                <span style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;color:#1B1B1F">Rename component</span>
                <span style="font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:400;color:#55555E">This will update every instance in the library.</span>
              </div>
              <button onClick="{{ closeModal }}" style="width:26px;height:26px;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#9A9AA5;flex-shrink:0" style-hover="background:hsl(215,15%,92%);color:#232329">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </div>
            <div style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
              <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#232329">Name</label>
              <input placeholder="Component name" defaultValue="Date Picker" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid hsl(210,14%,87%);background:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#232329;outline:none;transition:120ms ease-in" style-focus="border:1px solid hsl(210,100%,42%);outline:3px solid rgba(0,115,230,0.5);outline-offset:2px">
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;background:hsl(215,15%,97%);border-top:1px solid #ECECF0">
              <button onClick="{{ closeModal }}" style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:hsl(215,15%,12%);background:#FFFFFF;border:1px solid hsl(210,14%,87%);transition:120ms ease-in" style-hover="background:hsl(215,15%,97%)">Cancel</button>
              <button onClick="{{ closeModal }}" style="display:inline-flex;align-items:center;justify-content:center;padding:8px 14px 10px;height:40px;border-radius:10px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(9,11,11,0.6);background:hsl(210,100%,45%);border:1px solid hsl(210,100%,42%);box-shadow:inset 0 1px 0 rgba(51,153,255,0.5), inset 0 -1px 0 1px rgba(0,77,153,0.4), 0 2px 4px rgba(9,11,11,0.1);transition:120ms ease-in" style-hover="background:hsl(210,100%,38%);box-shadow:none">Save changes</button>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1100, &quot;height&quot;: 820 } }">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    return {
      open: this.state.open,
      openModal: () => this.setState({ open: true }),
      closeModal: () => this.setState({ open: false }),
      stop: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
