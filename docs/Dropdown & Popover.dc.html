<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FFFFFF; }
  a { color: #6366F1; text-decoration: none; }
  a:hover { color: #4F51D8; }
</style>
</helmet>
<div style="min-height:100vh;background:#FFFFFF;font-family:'Geist',system-ui,sans-serif;padding:72px 64px;box-sizing:border-box;display:flex;justify-content:center">
  <div style="display:flex;gap:120px;align-items:flex-start;flex-wrap:wrap">
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Dropdown menu — Interactive</div>
      <div style="position:relative;width:fit-content">
        <button onClick="{{ dToggle }}" style="{{ dTriggerStyle }}" style-hover="{{ dTriggerHover }}">
          Options
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="{{ dChevStyle }}"><path d="M6.5 9.5L12 15l5.5-5.5"></path></svg>
        </button>
        <sc-if value="{{ dOpen }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;top:100%;left:0;margin-top:6px;width:220px;background:#FFFFFF;border:1px solid #E2E2E8;border-radius:12px;box-shadow:0 8px 24px rgba(24,24,44,0.10), 0 2px 6px rgba(24,24,44,0.05);padding:5px;box-sizing:border-box;z-index:10">
            <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="5">
              <sc-if value="{{ m.divider }}" hint-placeholder-val="{{ false }}">
                <div style="height:1px;background:#ECECF0;margin:5px 6px"></div>
              </sc-if>
              <sc-if value="{{ m.item }}" hint-placeholder-val="{{ true }}">
                <div onClick="{{ m.onClick }}" onMouseEnter="{{ m.onEnter }}" onMouseLeave="{{ m.onLeave }}" style="{{ m.style }}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"></path></svg>
                  <span style="flex:1">{{ m.label }}</span>
                  <span style="{{ m.kbdStyle }}">{{ m.kbd }}</span>
                </div>
              </sc-if>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Popover — Interactive</div>
      <div style="position:relative;width:fit-content">
        <button onClick="{{ pToggle }}" style="{{ pTriggerStyle }}" style-hover="{{ pTriggerHover }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.5"></path></svg>
          About this component
        </button>
        <sc-if value="{{ pOpen }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;top:100%;left:0;margin-top:8px;width:300px;background:#FFFFFF;border:1px solid #E2E2E8;border-radius:12px;box-shadow:0 8px 24px rgba(24,24,44,0.10), 0 2px 6px rgba(24,24,44,0.05);box-sizing:border-box;z-index:10;overflow:hidden">
            <div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <span style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#1B1B1F">Date Picker</span>
                <span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#DFF2E4;color:#1F5B32;border:1px solid #A9D8B5;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:500">Stable</span>
              </div>
              <span style="font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:400;color:#55555E;line-height:1.5">Single and range selection with disabled dates, hover preview and keyboard navigation. Week starts on Monday.</span>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
                <span style="width:22px;height:22px;border-radius:50%;background:hsl(210,100%,94%);color:hsl(210,100%,35%);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600">AN</span>
                <span style="font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:400;color:#9A9AA5">An Nguyen · updated Aug 24</span>
              </div>
            </div>
            <div style="display:flex;gap:8px;padding:10px 16px;background:hsl(215,15%,97%);border-top:1px solid #ECECF0">
              <button style="flex:1;display:inline-flex;align-items:center;justify-content:center;height:32px;border-radius:8px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;color:hsl(215,15%,12%);background:#FFFFFF;border:1px solid hsl(210,14%,87%);transition:120ms ease-in" style-hover="background:hsl(215,15%,97%)">View docs</button>
              <button style="flex:1;display:inline-flex;align-items:center;justify-content:center;height:32px;border-radius:8px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;color:#fff;background:hsl(210,100%,45%);border:1px solid hsl(210,100%,42%);transition:120ms ease-in" style-hover="background:hsl(210,100%,38%)">Open in editor</button>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1000, &quot;height&quot;: 480 } }">
class Component extends DCLogic {
  state = { dOpen: true, pOpen: true, hovered: null };
  renderVals() {
    const secondaryBtn = {
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
      padding: '8px 14px 10px', height: '40px', borderRadius: '10px', cursor: 'pointer', userSelect: 'none',
      fontFamily: "'IBM Plex Sans',sans-serif", fontSize: '15px', fontWeight: 500, lineHeight: 1.25,
      color: 'hsl(215,15%,12%)', backgroundColor: 'rgba(232,235,237,0.1)', border: '1px solid hsl(210,14%,87%)',
      boxShadow: 'inset 0 1px 0 1px #fff, inset 0 -1px 0 1px rgba(223,226,231,0.4), 0 1px 2px rgba(223,226,231,0.5)',
      transition: '120ms ease-in',
    };
    const items = [
      { label: 'Edit', icon: 'M4 20l4.5-1L19 8.5 15.5 5 5 15.5 4 20z', kbd: '\u2318E' },
      { label: 'Duplicate', icon: 'M8 8h12v12H8zM8 8V4h12v12h-4', kbd: '\u2318D' },
      { label: 'Copy link', icon: 'M10 14a5 5 0 007 0l2.5-2.5a5 5 0 00-7-7L11 6M14 10a5 5 0 00-7 0L4.5 12.5a5 5 0 007 7L13 18', kbd: '' },
      { divider: true },
      { label: 'Archive', icon: 'M4 8V6h16v2M4 8h16v12H4zM10 12h4', kbd: '' },
      { label: 'Delete', icon: 'M3.5 7h17M9.5 7V4.5h5V7M6 7l1 13.5h10L18 7', kbd: '\u232B', danger: true },
    ];
    return {
      dOpen: this.state.dOpen, pOpen: this.state.pOpen,
      dToggle: () => this.setState(s => ({ dOpen: !s.dOpen })),
      pToggle: () => this.setState(s => ({ pOpen: !s.pOpen })),
      dTriggerStyle: { ...secondaryBtn, ...(this.state.dOpen ? { backgroundColor: 'hsl(215,15%,97%)', boxShadow: 'none' } : {}) },
      dTriggerHover: { backgroundColor: 'hsl(215,15%,97%)', boxShadow: 'none' },
      pTriggerStyle: { ...secondaryBtn, ...(this.state.pOpen ? { backgroundColor: 'hsl(215,15%,97%)', boxShadow: 'none' } : {}) },
      pTriggerHover: { backgroundColor: 'hsl(215,15%,97%)', boxShadow: 'none' },
      dChevStyle: { transition: 'transform 0.15s ease-out', transform: this.state.dOpen ? 'rotate(180deg)' : 'none' },
      menuItems: items.map((m, i) => m.divider ? { divider: true, item: false } : {
        divider: false, item: true,
        label: m.label, icon: m.icon, kbd: m.kbd,
        onClick: () => this.setState({ dOpen: false, hovered: null }),
        onEnter: () => this.setState({ hovered: i }),
        onLeave: () => this.setState({ hovered: null }),
        style: { height: '34px', borderRadius: '8px', display: 'flex', alignItems: 'center', gap: '10px', padding: '0 10px', cursor: 'pointer', userSelect: 'none', transition: 'background 100ms ease-in', fontFamily: "'IBM Plex Sans',sans-serif", fontSize: '14.5px', fontWeight: 400, color: m.danger ? 'hsl(0,72%,45%)' : '#232329', background: this.state.hovered === i ? (m.danger ? 'hsl(0,72%,96%)' : 'hsl(215,15%,95%)') : 'transparent' },
        kbdStyle: { fontFamily: "'IBM Plex Sans',sans-serif", fontSize: '12px', fontWeight: 400, color: '#9A9AA5' },
      }),
    };
  }
}
</script>
</body>
</html>
