<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #141519; }
  a { color: #818CF8; text-decoration: none; }
  a:hover { color: #A5B4FC; }
  input::placeholder { color: #9A9AA5; opacity: 1; }
</style>
</helmet>
<div style="min-height:100vh;background:#141519;font-family:'Geist',system-ui,sans-serif;padding:72px 64px;box-sizing:border-box;display:flex;justify-content:center">
  <div style="display:flex;flex-direction:column;gap:48px">
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Input / Text — states</div>
      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Label</label>
          <input placeholder="Placeholder" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid #3A3B44;background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:none;transition:120ms ease-in">
          <span style="font-size:12px;font-weight:500;color:#9A9AA5">Default</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Label</label>
          <input value="Input value" readOnly="{{ true }}" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid #3A3B44;background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:none">
          <span style="font-size:12px;font-weight:500;color:#9A9AA5">Filled</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Label</label>
          <input value="Input value" readOnly="{{ true }}" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid hsl(210,100%,42%);background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:3px solid rgba(0,115,230,0.5);outline-offset:2px">
          <span style="font-size:12px;font-weight:500;color:#9A9AA5">Focus</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Label</label>
          <input value="Wrong value" readOnly="{{ true }}" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid hsl(0,72%,51%);background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:3px solid rgba(220,38,38,0.25);outline-offset:2px">
          <span style="font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:hsl(0,75%,65%)">This field is required</span>
          <span style="font-size:12px;font-weight:500;color:#9A9AA5">Error</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#9A9AA5">Label</label>
          <input value="Input value" disabled="{{ true }}" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid #34353D;background:#22232A;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#5F5F6B;cursor:not-allowed;outline:none">
          <span style="font-size:12px;font-weight:500;color:#9A9AA5">Disabled</span>
        </div>
      </div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Input / With icon</div>
      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Search</label>
          <div style="position:relative;display:flex;align-items:center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AA5" stroke-width="2" stroke-linecap="round" style="position:absolute;left:12px;pointer-events:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input placeholder="Search components" style="width:100%;height:40px;box-sizing:border-box;padding:8px 12px 10px 36px;border-radius:10px;border:1px solid #3A3B44;background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:none;transition:120ms ease-in" style-focus="border:1px solid hsl(210,100%,42%);outline:3px solid rgba(0,115,230,0.5);outline-offset:2px">
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;width:260px">
          <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Amount</label>
          <div style="position:relative;display:flex;align-items:center">
            <input placeholder="0.00" style="width:100%;height:40px;box-sizing:border-box;padding:8px 44px 10px 12px;border-radius:10px;border:1px solid #3A3B44;background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:none;transition:120ms ease-in" style-focus="border:1px solid hsl(210,100%,42%);outline:3px solid rgba(0,115,230,0.5);outline-offset:2px">
            <span style="position:absolute;right:12px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;color:#9A9AA5;pointer-events:none">USD</span>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9A9AA5;margin-bottom:24px">Interactive</div>
      <div style="display:flex;flex-direction:column;gap:8px;width:320px">
        <label style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#E8E8EC">Label</label>
        <input placeholder="Type something…" style="height:40px;box-sizing:border-box;padding:8px 12px 10px 12px;border-radius:10px;border:1px solid #3A3B44;background:#1E1F25;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:400;color:#E8E8EC;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);outline:none;transition:120ms ease-in" style-hover="border:1px solid #4A4B55" style-focus="border:1px solid hsl(210,100%,42%);outline:3px solid rgba(0,115,230,0.5);outline-offset:2px">
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1400, &quot;height&quot;: 560 } }"></script>
</body>
</html>
