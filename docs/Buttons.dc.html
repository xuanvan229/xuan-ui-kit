  state = { hovered: {} };
  renderVals() {
    const arrow = (k) => ({ marginLeft: '4px', display: 'inline-flex', transition: '0.2s', transform: this.state.hovered[k] ? 'translateX(2px)' : 'none' });
    const set = (k, v) => () => this.setState(s => ({ hovered: { ...s.hovered, [k]: v } }));
    return {
      onEnter: set('P', true), onLeave: set('P', false), arrowStyle: arrow('P'),
      onEnterS: set('S', true), onLeaveS: set('S', false), arrowStyleS: arrow('S'),
      onEnterO: set('O', true), onLeaveO: set('O', false), arrowStyleO: arrow('O'),
      onEnterG: set('G', true), onLeaveG: set('G', false), arrowStyleG: arrow('G'),
    };
  }
}
</script>
</body>
</html>
